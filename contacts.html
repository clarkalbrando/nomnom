<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Clark Albrando</title>
  <link rel="stylesheet" href="styles-common.css">
  <link rel="stylesheet" href="styles-contact.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="brand" href="contacts.html">Clark Albrando</a>
      <button class="burger" id="burger-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav">
        <a href="index.html#hero">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="education.html">Education</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contacts.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="about-page">
    <section class="section">
      <div class="section-intro">
        <h2>Contact Me</h2>
        <p>Have a web project, question, or collaboration idea? Send a message and I'll get back to you soon.</p>
      </div>

      <div class="contact-grid">
        <div class="contact-card">
          <p><strong>Email</strong></p>
          <a href="mailto:clarkonid@gamil.com">clarkonid@gamil.com</a>
        </div>
        <div class="contact-card">
          <p><strong>Location</strong></p>
          <p>Carcar City, Cebu</p>
        </div>
      </div>

      <div id="contact-message" class="notification" style="display:none"></div>
      <div class="form-map-row">

        <form id="contact-form" class="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell me about your project" required></textarea>

          <button type="submit" class="button">Send Message</button>
        </form>

        <div class="map-standalone">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d444.2975956544817!2d123.66939214601462!3d10.12210418034621!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sph!4v1777909813136!5m2!1sen!2sph"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

      </div>

    </section>
  </main>

  <footer class="footer">
    <p>© <span id="current-year"></span> Clark Albrando.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
